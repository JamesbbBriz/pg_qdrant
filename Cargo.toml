[workspace]
members = ["crates/edge-probe", "crates/pg_qdrant"]
default-members = ["crates/edge-probe"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/JamesbbBriz/pg_qdrant"

[workspace.dependencies]
qdrant-edge = "=0.8.0"
pgrx = { version = "=0.19.3", default-features = false, features = ["cshim"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
debug = 0
lto = "thin"
codegen-units = 1

[package]
name = "pg-qdrant-helper"
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
description = "Managed native-engine process comparison for pg_qdrant P0"
publish = false

[[bin]]
name = "pg_qdrant_p0_helper"
path = "src/main.rs"

[features]
default = []
p0-fault-injection = ["pg-qdrant-edge-probe/p0-fault-injection"]

[dependencies]
qdrant-edge = "=0.8.0"
tantivy = { version = "=0.26.2", default-features = false, features = ["lz4-compression"] }
levenshtein_automata = "=0.2.1"
tantivy-fst = "=0.5.0"
pg-qdrant-protocol = { path = "../pg_qdrant-protocol" }
pg-qdrant-edge-probe = { path = "../edge-probe" }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
libc = "=0.2.189"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

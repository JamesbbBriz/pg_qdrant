name: Local bounded dense and fusion measurement
on: workflow_dispatch
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Copy frozen code, fixtures and pinned model inputs
        run: mkdir -p /tmp/quality-input && cp -a /pgq-input/. /tmp/quality-input/
      - name: Test checksum, identity and measurement refusal paths
        run: cd /tmp/quality-input && python3 -m unittest discover -s scripts/tests -p 'test_dense_quality.py' -v
      - name: Add optional offline encoding runtime to the selected product
        run: |
          python3 /tmp/quality-input/scripts/retry_snapshot_build.py docker build --label io.pg_qdrant.ci.image-run=${PGQ_RUN_ID} --network=none --file /tmp/quality-input/ci/Dockerfile.dense-quality \
            --build-arg PGQ_QUALITY_BASE="pgq-quality-base-${PGQ_RUN_ID}" \
            --tag "pgq-quality-${PGQ_RUN_ID}" /tmp/quality-input
      - name: Encode real model vectors then measure installed SQL plans
        run: |
          docker run --name "pgq-quality-${PGQ_RUN_ID}" --label io.pg_qdrant.ci.lifecycle=1 --label "io.pg_qdrant.ci.quality=${PGQ_RUN_ID}" \
            --memory=2g --memory-swap=2g --pids-limit=128 --cpus=2 --network=none \
            "pgq-quality-${PGQ_RUN_ID}"
      - name: Collect encoding and retrieval evidence including failures
        if: always()
        run: |
          mkdir -p /tmp/quality-evidence
          if docker inspect "pgq-quality-${PGQ_RUN_ID}" >/dev/null 2>&1; then
            docker cp "pgq-quality-${PGQ_RUN_ID}:/src/artifacts/quality/." /tmp/quality-evidence/
          fi

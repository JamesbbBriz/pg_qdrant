name: Draft phase static review (manual only)

# This intentionally does NOT run on push or pull_request.
# It is not the PG17/Edge integration, native, fault, or release CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the requested review revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify existing source/contract ledgers
        run: python3 scripts/check_contracts.py
      - name: Run Python regressions and syntax checks
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 -m compileall -q scripts
      - name: Ensure an unverified preview cannot be released
        run: |
          if python3 scripts/check_release_gate.py \
                --attestation packaging/release-attestation.example.json; then
            echo 'Release gate incorrectly allowed draft release' >&2
            exit 1
          fi
          echo 'Expected: incomplete P0-P5 draft release rejected'

name: P0 embedded-engine feasibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0:
    # Feature branches run once through their PR; main also verifies direct pushes.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate locked product contracts
        id: contracts
        run: |
          python3 scripts/check_contracts.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build exact Rust, Edge, pgrx and PostgreSQL prototype
        id: base_image
        run: docker build --file Dockerfile.p0 --build-arg PG_QDRANT_SOURCE_SHA=${{ github.sha }} --tag pg-qdrant-p0 .
      # Each experiment depends on its image, not unrelated earlier experiments.
      # A failed experiment still fails the job; no continue-on-error is used.
      - name: Build the independent lexical candidate experiment
        id: lexical_image
        if: ${{ !cancelled() && steps.base_image.outcome == 'success' }}
        run: docker build --file Dockerfile.p0-lexical --tag pg-qdrant-p0-lexical .
      - name: Characterize isolated Tantivy lexical primitives
        if: ${{ !cancelled() && steps.lexical_image.outcome == 'success' }}
        run: |
          docker create --name pg-qdrant-p0-tantivy-run --memory=512m --memory-swap=512m \
            --pids-limit=64 --cpus=1 --network=none pg-qdrant-p0-lexical bash -c '
              set -euo pipefail
              ulimit -c 0
              timeout --kill-after=5s 45s target/tantivy-probe/debug/pg-qdrant-tantivy-feasibility \
                > /src/artifacts/tantivy-probe.json
              cat /src/artifacts/tantivy-probe.json
            '
          docker start --attach pg-qdrant-p0-tantivy-run
      - name: Collect isolated lexical evidence
        if: always()
        run: |
          mkdir -p artifacts/tantivy
          if docker inspect pg-qdrant-p0-tantivy-run >/dev/null 2>&1; then
            docker cp pg-qdrant-p0-tantivy-run:/src/artifacts/. artifacts/tantivy/
          fi
      - name: Test Edge ENOSPC on a dedicated 32 MiB tmpfs
        if: ${{ !cancelled() && steps.base_image.outcome == 'success' }}
        run: |
          docker create --name pg-qdrant-p0-disk-run --memory=5g --cpus=2 --network=none \
            --tmpfs /pgq-p0-faults:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=0700 \
            --env PG_QDRANT_ENOSPC_DIR=/pgq-p0-faults \
            pg-qdrant-p0 python3 scripts/run_disk_probe.py
          docker start --attach pg-qdrant-p0-disk-run
      - name: Collect bounded disk-failure evidence
        if: always()
        run: |
          mkdir -p artifacts/enospc
          if docker inspect pg-qdrant-p0-disk-run >/dev/null 2>&1; then
            docker cp pg-qdrant-p0-disk-run:/src/artifacts/. artifacts/enospc/
          fi
      - name: Test full-text ENOSPC recovery on an exact 384 MiB tmpfs
        if: ${{ !cancelled() && steps.base_image.outcome == 'success' }}
        run: |
          docker create --name pg-qdrant-p0-full-text-disk-run --memory=5g --cpus=2 --network=none \
            --tmpfs /pgq-p0-faults:rw,noexec,nosuid,nodev,size=384m,uid=10001,gid=10001,mode=0700 \
            --env PG_QDRANT_ENOSPC_DIR=/pgq-p0-faults \
            pg-qdrant-p0 python3 scripts/run_disk_probe.py --profile full-text
          docker start --attach pg-qdrant-p0-full-text-disk-run
      - name: Observe a clean full-text reopen on a separate exact 384 MiB tmpfs
        if: ${{ !cancelled() && steps.base_image.outcome == 'success' }}
        run: |
          docker create --name pg-qdrant-p0-full-text-clean-run --memory=5g --cpus=2 --network=none \
            --tmpfs /pgq-p0-faults:rw,noexec,nosuid,nodev,size=384m,uid=10001,gid=10001,mode=0700 \
            --env PG_QDRANT_ENOSPC_DIR=/pgq-p0-faults \
            pg-qdrant-p0 python3 scripts/run_disk_probe.py --profile full-text --clean
          docker start --attach pg-qdrant-p0-full-text-clean-run
      - name: Require zero-write refusal of the unsupported 128 MiB full-text budget
        if: ${{ !cancelled() && steps.base_image.outcome == 'success' }}
        run: |
          docker create --name pg-qdrant-p0-full-text-capacity-run --memory=5g --cpus=2 --network=none \
            --tmpfs /pgq-p0-faults:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700 \
            --env PG_QDRANT_ENOSPC_DIR=/pgq-p0-faults \
            pg-qdrant-p0 python3 scripts/run_disk_probe.py --profile full-text --characterize-128-capacity-refusal
          docker start --attach pg-qdrant-p0-full-text-capacity-run
      - name: Collect full-text disk-failure evidence
        if: always()
        run: |
          mkdir -p artifacts/enospc-full-text
          if docker inspect pg-qdrant-p0-full-text-disk-run >/dev/null 2>&1; then
            docker cp pg-qdrant-p0-full-text-disk-run:/src/artifacts/. artifacts/enospc-full-text/
          fi
          if docker inspect pg-qdrant-p0-full-text-clean-run >/dev/null 2>&1; then
            docker cp pg-qdrant-p0-full-text-clean-run:/src/artifacts/. artifacts/enospc-full-text/
          fi
          if docker inspect pg-qdrant-p0-full-text-capacity-run >/dev/null 2>&1; then
            docker cp pg-qdrant-p0-full-text-capacity-run:/src/artifacts/. artifacts/enospc-full-text/
          fi
      - name: Run PostgreSQL integration probes as a non-root user
        if: ${{ !cancelled() && steps.base_image.outcome == 'success' }}
        run: |
          docker create --name pg-qdrant-p0-run --memory=5g --cpus=2 --network=none pg-qdrant-p0
          docker start --attach pg-qdrant-p0-run
      - name: Collect integration evidence
        if: always()
        run: |
          mkdir -p artifacts/normal
          if docker inspect pg-qdrant-p0-run >/dev/null 2>&1; then
            docker cp pg-qdrant-p0-run:/src/artifacts/. artifacts/normal/
          fi
      - name: Build explicitly enabled disposable fault-test image
        id: fault_image
        if: ${{ !cancelled() && steps.base_image.outcome == 'success' }}
        run: docker build --file Dockerfile.p0 --build-arg PG_QDRANT_SOURCE_SHA=${{ github.sha }} --build-arg P0_FAULTS=1 --tag pg-qdrant-p0-faults .
      - name: Measure worker crash and PostgreSQL collateral recovery
        if: ${{ !cancelled() && steps.fault_image.outcome == 'success' }}
        run: |
          docker create --name pg-qdrant-p0-fault-run --memory=5g --cpus=2 --network=none pg-qdrant-p0-faults bash crates/pg_qdrant/tests/run-faults.sh
          docker start --attach pg-qdrant-p0-fault-run
      - name: Collect fault-test evidence
        if: always()
        run: |
          mkdir -p artifacts/faults
          if docker inspect pg-qdrant-p0-fault-run >/dev/null 2>&1; then
            docker cp pg-qdrant-p0-fault-run:/src/artifacts/. artifacts/faults/
          fi
      - name: Build the managed-helper comparison without fault injection
        id: helper_normal_image
        if: ${{ !cancelled() && steps.base_image.outcome == 'success' }}
        run: docker build --file Dockerfile.p0 --build-arg PG_QDRANT_SOURCE_SHA=${{ github.sha }} --build-arg P0_HELPER=1 --tag pg-qdrant-p0-helper-normal .
      - name: Test the normal helper protocol
        if: ${{ !cancelled() && steps.helper_normal_image.outcome == 'success' }}
        run: |
          docker create --name pg-qdrant-p0-helper-normal-pipes-run --memory=5g --cpus=2 --network=none \
            pg-qdrant-p0-helper-normal python3 crates/pg_qdrant-helper/tests/probe.py \
            target/debug/pg_qdrant_p0_helper --out /src/artifacts/helper-pipes.json
          docker start --attach pg-qdrant-p0-helper-normal-pipes-run
      - name: Test the normal helper SQL profile
        if: ${{ !cancelled() && steps.helper_normal_image.outcome == 'success' }}
        run: |
          docker create --name pg-qdrant-p0-helper-normal-run --memory=5g --cpus=2 --network=none \
            pg-qdrant-p0-helper-normal bash crates/pg_qdrant/tests/run-p0.sh
          docker start --attach pg-qdrant-p0-helper-normal-run
      - name: Collect normal managed-helper evidence
        if: always()
        run: |
          mkdir -p artifacts/helper-normal
          if docker inspect pg-qdrant-p0-helper-normal-pipes-run >/dev/null 2>&1; then
            docker cp pg-qdrant-p0-helper-normal-pipes-run:/src/artifacts/. artifacts/helper-normal/
          fi
          if docker inspect pg-qdrant-p0-helper-normal-run >/dev/null 2>&1; then
            docker cp pg-qdrant-p0-helper-normal-run:/src/artifacts/. artifacts/helper-normal/
          fi
      - name: Build the explicit managed-helper fault comparison
        id: helper_fault_image
        if: ${{ !cancelled() && steps.base_image.outcome == 'success' }}
        run: docker build --file Dockerfile.p0 --build-arg PG_QDRANT_SOURCE_SHA=${{ github.sha }} --build-arg P0_HELPER=1 --build-arg P0_FAULTS=1 --tag pg-qdrant-p0-helper .
      - name: Test private helper protocol and process isolation
        if: ${{ !cancelled() && steps.helper_fault_image.outcome == 'success' }}
        run: |
          docker create --name pg-qdrant-p0-helper-fault-pipes-run --memory=5g --cpus=2 --network=none \
            pg-qdrant-p0-helper python3 crates/pg_qdrant-helper/tests/probe.py \
            target/debug/pg_qdrant_p0_helper --faults --out /src/artifacts/helper-fault-pipes.json
          docker start --attach pg-qdrant-p0-helper-fault-pipes-run
      - name: Test private helper SQL behavior and PostgreSQL recovery
        if: ${{ !cancelled() && steps.helper_fault_image.outcome == 'success' }}
        run: |
          docker create --name pg-qdrant-p0-helper-run --memory=5g --cpus=2 --network=none \
            pg-qdrant-p0-helper bash crates/pg_qdrant/tests/run-faults.sh
          docker start --attach pg-qdrant-p0-helper-run
      - name: Collect managed-helper evidence
        if: always()
        run: |
          mkdir -p artifacts/helper
          if docker inspect pg-qdrant-p0-helper-fault-pipes-run >/dev/null 2>&1; then
            docker cp pg-qdrant-p0-helper-fault-pipes-run:/src/artifacts/. artifacts/helper/
          fi
          if docker inspect pg-qdrant-p0-helper-run >/dev/null 2>&1; then
            docker cp pg-qdrant-p0-helper-run:/src/artifacts/. artifacts/helper/
          fi
      - name: Test installed source-to-Edge flush and exact ACK
        if: ${{ !cancelled() && steps.helper_fault_image.outcome == 'success' }}
        run: |
          docker create --name pg-qdrant-p1-product --memory=5g --cpus=2 --network=none \
            pg-qdrant-p0-helper bash crates/pg_qdrant/tests/run-p1.sh
          docker start --attach pg-qdrant-p1-product
      - name: Collect installed P1 and crash-replay evidence
        if: always()
        run: |
          mkdir -p artifacts/p1-product
          if docker inspect pg-qdrant-p1-product >/dev/null 2>&1; then
            docker cp pg-qdrant-p1-product:/src/artifacts/. artifacts/p1-product/
          fi
      - name: Observe kernel OOM and direct-worker PostgreSQL recovery
        if: ${{ !cancelled() && steps.fault_image.outcome == 'success' && steps.helper_fault_image.outcome == 'success' }}
        run: >-
          python3 scripts/run_oom_container.py
          --image pg-qdrant-p0-faults
          --profile direct_worker
          --artifacts artifacts/oom-direct
      - name: Observe kernel OOM and managed-helper containment
        if: ${{ !cancelled() && steps.fault_image.outcome == 'success' && steps.helper_fault_image.outcome == 'success' }}
        run: >-
          python3 scripts/run_oom_container.py
          --image pg-qdrant-p0-helper
          --profile managed_helper
          --artifacts artifacts/oom-helper
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p0-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
